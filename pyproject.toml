[project]
name = "fundamentals"
version = "0.1.0"
description = "Fundamentals, technical analysis, forward multiples and peer comparison for US stocks, with an AI reading of the numbers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.142.2",
    "google-cloud-storage>=3.16.0",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
    "yfinance>=1.7.0",
]

[project.scripts]
fundamentals = "fundamentals.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Only for building the peer map on the owner's machine (`make peers`). The service does not
# install it: it reads the map the build leaves in src/fundamentals/peers.json.
peers = [
    "fastembed>=0.4",
    "numpy>=2",
    "scikit-learn>=1.5",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
